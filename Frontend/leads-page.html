<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leads · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1116;
    --card: #15171D;
    --card-header: #191C23;
    --row-hover: #191C23;
    --border: #252932;
    --border-strong: #343946;
    --input-bg: #14161C;
    --input-border: #333844;
    --text-primary: #F5F6F7;
    --text-secondary: #8B93A1;
    --text-tertiary: #5B6270;
    --accent: #6366F1;
    --accent-hover: #7B7EF5;
    --success: #34D399;
    --info: #38BDF8;
    --purple: #A78BFA;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 32px 24px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .wrap{ max-width: 1152px; margin: 0 auto; }

  /* ---------- Page header ---------- */
  .page-header{
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-header h1{
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  .page-header p{
    margin: 4px 0 0;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .header-actions{ display: flex; align-items: center; gap: 12px; }

  /* ---------- Buttons ---------- */
  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .btn-secondary{
    background: var(--card);
    border: 1px solid var(--border);
    color: #D7DAE0;
    padding: 9px 14px;
  }
  .btn-secondary:hover{ background: #20232C; border-color: var(--border-strong); }
  .btn-primary{
    background: var(--accent);
    border: 1px solid transparent;
    color: #fff;
    font-weight: 600;
    padding: 9px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .btn-primary:hover{ background: var(--accent-hover); }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--input-border);
    color: #C7CBD3;
    padding: 8px 14px;
  }
  .btn-ghost:hover{ background: #20232C; }
  .btn-edit{
    background: transparent;
    border: 1px solid var(--border);
    color: #C7CBD3;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
  }
  .btn-edit:hover{ background: #20232C; border-color: var(--border-strong); }

  /* ---------- Status filter dropdown ---------- */
  .dropdown{ position: relative; }
  .dropdown-btn svg{ transition: transform .15s ease; color: var(--text-secondary); }
  .dropdown-btn[aria-expanded="true"] svg{ transform: rotate(180deg); }
  .dropdown-menu{
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    width: 176px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 20px 40px rgba(0,0,0,.45);
    overflow: hidden;
    z-index: 30;
    display: none;
  }
  .dropdown-menu.open{ display: block; }
  .dropdown-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: #C7CBD3;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .dropdown-item:hover{ background: #20232C; }
  .dropdown-item.active{ background: rgba(99,102,241,.1); color: #A5B4FC; }
  .dropdown-item svg{ display: none; color: #818CF8; }
  .dropdown-item.active svg{ display: inline-block; }

  /* ---------- Card ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .card-header{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-header h2{
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: #E7E9ED;
  }
  .card-header .count{
    margin: 2px 0 0;
    font-size: 12px;
    color: #767D8A;
  }

  .search{ position: relative; width: 256px; max-width: 100%; }
  .search svg{
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
  }
  .search input{
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    padding: 8px 12px 8px 30px;
    font-size: 14px;
    color: #E7E9ED;
    font-family: inherit;
  }
  .search input::placeholder{ color: var(--text-tertiary); }
  .search input:focus{
    outline: none;
    border-color: rgba(99,102,241,.6);
    box-shadow: 0 0 0 3px rgba(99,102,241,.25);
  }

  /* ---------- Table ---------- */
  .table-scroll{ overflow-x: auto; }
  table{ width: 100%; min-width: 900px; border-collapse: collapse; text-align: left; }
  thead tr{ background: var(--card-header); }
  th{
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #767D8A;
    padding: 12px 20px;
  }
  th.right, td.right{ text-align: right; }
  tbody tr{
    border-top: 1px solid #21242C;
    font-size: 14px;
    color: #C7CBD3;
    transition: background-color .12s ease;
  }
  tbody tr:hover{ background: var(--row-hover); }
  td{ padding: 14px 20px; white-space: nowrap; }
  .lead-name{ font-weight: 500; color: #F0F1F3; }
  .lead-company{ font-size: 12px; color: #767D8A; margin-top: 2px; }
  .cell-icon{ display: inline-flex; align-items: center; gap: 6px; color: #AEB4C0; }
  .cell-icon svg{ color: var(--text-tertiary); flex-shrink: 0; }
  .id-cell{ color: #767D8A; font-size: 12px; }
  .muted-cell{ color: #8B93A1; font-size: 12px; }
  .source-cell{ color: #AEB4C0; font-size: 12px; }
  .empty-row td{ text-align: center; padding: 40px 20px; color: #767D8A; font-size: 14px; }

  /* ---------- Status badge ---------- */
  .badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .badge .dot{ width: 6px; height: 6px; border-radius: 50%; }
  .badge-new{ color: var(--success); background: rgba(52,211,153,.1); box-shadow: inset 0 0 0 1px rgba(52,211,153,.25); }
  .badge-new .dot{ background: var(--success); }
  .badge-contacted{ color: var(--info); background: rgba(56,189,248,.1); box-shadow: inset 0 0 0 1px rgba(56,189,248,.25); }
  .badge-contacted .dot{ background: var(--info); }
  .badge-qualified{ color: var(--purple); background: rgba(167,139,250,.1); box-shadow: inset 0 0 0 1px rgba(167,139,250,.25); }
  .badge-qualified .dot{ background: var(--purple); }

  /* status pills used inside modal */
  .status-pill{
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    text-align: center;
    cursor: pointer;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-secondary);
    font-family: inherit;
    transition: border-color .12s ease;
  }
  .status-pill:hover{ border-color: var(--border-strong); }
  .status-pill.selected-new{ background: rgba(52,211,153,.1); color: var(--success); border-color: transparent; box-shadow: inset 0 0 0 1px rgba(52,211,153,.35); }
  .status-pill.selected-contacted{ background: rgba(56,189,248,.1); color: var(--info); border-color: transparent; box-shadow: inset 0 0 0 1px rgba(56,189,248,.35); }
  .status-pill.selected-qualified{ background: rgba(167,139,250,.1); color: var(--purple); border-color: transparent; box-shadow: inset 0 0 0 1px rgba(167,139,250,.35); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-overlay.open{ display: flex; }
  .modal{
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,.5);
  }
  .modal-header{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3{ margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .modal-header p{ margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
  .modal-close{
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
  }
  .modal-close:hover{ background: #252932; color: #D7DAE0; }

  .modal-body{ padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .field label{
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #9AA0AC;
    margin-bottom: 6px;
  }
  .field input{
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #F2F3F5;
    font-family: inherit;
  }
  .field input::placeholder{ color: #5B6270; }
  .field input:focus{
    outline: none;
    border-color: rgba(99,102,241,.6);
    box-shadow: 0 0 0 3px rgba(99,102,241,.25);
  }
  .status-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .modal-footer{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px){
    body{ padding: 20px 14px; }
    .search{ width: 100%; }
    .card-header{ flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1>Leads</h1>
      <p>Manage and track your sales leads</p>
    </div>
    <div class="header-actions">
      <div class="dropdown" id="statusDropdown">
        <button class="btn btn-secondary dropdown-btn" id="statusDropdownBtn" aria-expanded="false">
          See By Status
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="dropdown-menu" id="statusDropdownMenu">
          <button class="dropdown-item active" data-filter="All Leads">
            All Leads
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
          <button class="dropdown-item" data-filter="New">
            New
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
          <button class="dropdown-item" data-filter="Contacted">
            Contacted
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
          <button class="dropdown-item" data-filter="Qualified">
            Qualified
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="openModalHeaderBtn">Update Lead</button>
    </div>
  </div>

  <!-- Card -->
  <div class="card">
    <div class="card-header">
      <div>
        <h2>Leads Database</h2>
        <p class="count" id="resultCount">9 leads</p>
      </div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search leads..." />
      </div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Created</th>
            <th>Updated</th>
            <th>Source</th>
            <th>Status</th>
            <th class="right">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Update Lead Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h3>Update Lead</h3>
        <p id="modalLeadId">LD-0000</p>
      </div>
      <button class="modal-close" id="modalCloseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="fieldName">Name</label>
        <input type="text" id="fieldName" placeholder="Full name" />
      </div>
      <div class="field">
        <label for="fieldEmail">Email</label>
        <input type="text" id="fieldEmail" placeholder="name@company.com" />
      </div>
      <div class="field">
        <label for="fieldPhone">Phone</label>
        <input type="text" id="fieldPhone" placeholder="+1 (000) 000-0000" />
      </div>
      <div class="field">
        <label for="fieldCompany">Company</label>
        <input type="text" id="fieldCompany" placeholder="Company name" />
      </div>
      <div class="field">
        <label>Status</label>
        <div class="status-grid" id="statusGrid">
          <button type="button" class="status-pill" data-status="NEW">NEW</button>
          <button type="button" class="status-pill" data-status="CONTACTED">CONTACTED</button>
          <button type="button" class="status-pill" data-status="QUALIFIED">QUALIFIED</button>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" id="modalCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn">Update Lead</button>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------------
  let leads = [
    { id: "LD-1042", name: "Priya Nair", email: "priya.nair@brightfield.io", phone: "+1 (415) 555-0142", company: "Brightfield Analytics", created: "Aug 02, 2026", updated: "Aug 15, 2026", source: "Website", status: "QUALIFIED" },
    { id: "LD-1041", name: "Marcus Chen", email: "m.chen@harborline.co", phone: "+1 (206) 555-0119", company: "Harborline Logistics", created: "Aug 01, 2026", updated: "Aug 14, 2026", source: "Referral", status: "CONTACTED" },
    { id: "LD-1040", name: "Sofia Reyes", email: "sofia@vantagepeak.com", phone: "+1 (312) 555-0187", company: "Vantage Peak Ventures", created: "Jul 30, 2026", updated: "Aug 13, 2026", source: "LinkedIn", status: "NEW" },
    { id: "LD-1039", name: "Daniel Osei", email: "d.osei@cinderworks.net", phone: "+1 (617) 555-0163", company: "Cinderworks Studio", created: "Jul 29, 2026", updated: "Aug 12, 2026", source: "Trade Show", status: "CONTACTED" },
    { id: "LD-1038", name: "Elena Vasquez", email: "elena.v@northgate.io", phone: "+1 (512) 555-0104", company: "Northgate Partners", created: "Jul 27, 2026", updated: "Aug 11, 2026", source: "Website", status: "QUALIFIED" },
    { id: "LD-1037", name: "Tom Bradley", email: "tbradley@fernhollow.com", phone: "+1 (720) 555-0176", company: "Fernhollow Supply Co.", created: "Jul 25, 2026", updated: "Aug 09, 2026", source: "Cold Call", status: "NEW" },
    { id: "LD-1036", name: "Aisha Rahman", email: "aisha@lumenpath.ai", phone: "+1 (929) 555-0198", company: "Lumenpath AI", created: "Jul 22, 2026", updated: "Aug 06, 2026", source: "Referral", status: "QUALIFIED" },
    { id: "LD-1035", name: "Jonas Weber", email: "jonas.weber@ironclad-ind.com", phone: "+1 (773) 555-0155", company: "Ironclad Industries", created: "Jul 20, 2026", updated: "Aug 04, 2026", source: "LinkedIn", status: "CONTACTED" },
    { id: "LD-1034", name: "Grace Lin", email: "grace.lin@coppergate.co", phone: "+1 (503) 555-0133", company: "Coppergate Retail", created: "Jul 18, 2026", updated: "Aug 02, 2026", source: "Website", status: "NEW" },
  ];

  let activeFilter = "All Leads";
  let searchQuery = "";
  let currentModalLeadId = null;

  const badgeClass = { NEW: "badge-new", CONTACTED: "badge-contacted", QUALIFIED: "badge-qualified" };

  const iconMail = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"></path><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6Z"></path><path d="m22 6-10 7L2 6"></path></svg>`;
  const iconPhone = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`;

  // ---------------------------------------------------------------------
  // Render table
  // ---------------------------------------------------------------------
  function renderTable(){
    const tbody = document.getElementById("tableBody");
    const q = searchQuery.trim().toLowerCase();

    const filtered = leads.filter(l => {
      const matchesFilter = activeFilter === "All Leads" || l.status === activeFilter.toUpperCase();
      const matchesQuery = q === "" ||
        l.name.toLowerCase().includes(q) ||
        l.company.toLowerCase().includes(q) ||
        l.email.toLowerCase().includes(q);
      return matchesFilter && matchesQuery;
    });

    document.getElementById("resultCount").textContent =
      `${filtered.length} lead${filtered.length !== 1 ? "s" : ""}` + (activeFilter !== "All Leads" ? ` · ${activeFilter}` : "");

    if(filtered.length === 0){
      tbody.innerHTML = `<tr class="empty-row"><td colspan="9">No leads match this filter.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(l => `
      <tr>
        <td class="id-cell mono">${l.id}</td>
        <td>
          <div class="lead-name">${l.name}</div>
          <div class="lead-company">${l.company}</div>
        </td>
        <td><span class="cell-icon">${iconMail}${l.email}</span></td>
        <td class="mono"><span class="cell-icon">${iconPhone}${l.phone}</span></td>
        <td class="muted-cell">${l.created}</td>
        <td class="muted-cell">${l.updated}</td>
        <td class="source-cell">${l.source}</td>
        <td>
          <span class="badge ${badgeClass[l.status]}">
            <span class="dot"></span>${l.status}
          </span>
        </td>
        <td class="right">
          <button class="btn-edit" data-edit-id="${l.id}">Edit</button>
        </td>
      </tr>
    `).join("");

    document.querySelectorAll("[data-edit-id]").forEach(btn => {
      btn.addEventListener("click", () => openModal(btn.getAttribute("data-edit-id")));
    });
  }

  // ---------------------------------------------------------------------
  // Status filter dropdown
  // ---------------------------------------------------------------------
  const dropdownBtn = document.getElementById("statusDropdownBtn");
  const dropdownMenu = document.getElementById("statusDropdownMenu");

  dropdownBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = dropdownMenu.classList.toggle("open");
    dropdownBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });

  document.querySelectorAll(".dropdown-item").forEach(item => {
    item.addEventListener("click", () => {
      activeFilter = item.getAttribute("data-filter");
      document.querySelectorAll(".dropdown-item").forEach(i => i.classList.remove("active"));
      item.classList.add("active");
      dropdownMenu.classList.remove("open");
      dropdownBtn.setAttribute("aria-expanded", "false");
      renderTable();
    });
  });

  document.addEventListener("click", (e) => {
    if(!document.getElementById("statusDropdown").contains(e.target)){
      dropdownMenu.classList.remove("open");
      dropdownBtn.setAttribute("aria-expanded", "false");
    }
  });

  // ---------------------------------------------------------------------
  // Search
  // ---------------------------------------------------------------------
  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderTable();
  });

  // ---------------------------------------------------------------------
  // Modal
  // ---------------------------------------------------------------------
  const modalOverlay = document.getElementById("modalOverlay");
  const statusGrid = document.getElementById("statusGrid");
  let selectedStatus = "NEW";

  function pillClassFor(status){
    if(status === "NEW") return "selected-new";
    if(status === "CONTACTED") return "selected-contacted";
    if(status === "QUALIFIED") return "selected-qualified";
    return "";
  }

  function renderStatusPills(){
    document.querySelectorAll(".status-pill").forEach(pill => {
      const s = pill.getAttribute("data-status");
      pill.className = "status-pill" + (s === selectedStatus ? " " + pillClassFor(s) : "");
    });
  }

  statusGrid.addEventListener("click", (e) => {
    const pill = e.target.closest(".status-pill");
    if(!pill) return;
    selectedStatus = pill.getAttribute("data-status");
    renderStatusPills();
  });

  function openModal(leadId){
    const lead = leads.find(l => l.id === leadId) || leads[0];
    currentModalLeadId = lead.id;

    document.getElementById("modalLeadId").textContent = lead.id;
    document.getElementById("fieldName").value = lead.name;
    document.getElementById("fieldEmail").value = lead.email;
    document.getElementById("fieldPhone").value = lead.phone;
    document.getElementById("fieldCompany").value = lead.company;
    selectedStatus = lead.status;
    renderStatusPills();

    modalOverlay.classList.add("open");
  }

  function closeModal(){
    modalOverlay.classList.remove("open");
  }

  document.getElementById("openModalHeaderBtn").addEventListener("click", () => openModal(leads[0].id));
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => { if(e.target === modalOverlay) closeModal(); });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeModal(); });

  document.getElementById("modalSaveBtn").addEventListener("click", () => {
    const lead = leads.find(l => l.id === currentModalLeadId);
    if(!lead) return;

    lead.name = document.getElementById("fieldName").value || lead.name;
    lead.email = document.getElementById("fieldEmail").value || lead.email;
    lead.phone = document.getElementById("fieldPhone").value || lead.phone;
    lead.company = document.getElementById("fieldCompany").value || lead.company;
    lead.status = selectedStatus;
    lead.updated = "Aug 17, 2026";

    closeModal();
    renderTable();
  });

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------
  renderTable();
</script>

</body>
</html>
